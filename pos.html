<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Anabela</title><link rel="manifest" href="manifest-pos.json"><meta name="theme-color" content="#c4452d">
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#faf5e9;color:#2a2118}
header{background:#c4452d;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
nav{display:flex}nav button{flex:1;padding:12px;border:0;background:#efe4cf;font-size:15px}nav .on{background:#faf5e9;font-weight:700}
main{padding:12px;padding-bottom:90px}button{font:inherit}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.p{padding:14px 8px;border:1px solid #d9ccb2;background:#fff;border-radius:10px;text-align:left}.p small{display:block;color:#7a6a55}
.cat{margin:14px 0 6px;font-weight:700;color:#c4452d}
input,select{width:100%;padding:10px;margin:4px 0;border:1px solid #d9ccb2;border-radius:8px;font:inherit}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #c4452d;padding:10px 12px;max-height:62vh;overflow:auto}
.go{width:100%;padding:14px;border:0;border-radius:10px;background:#c4452d;color:#fff;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dotted #d9ccb2}
.q button,.pb{min-width:34px;height:34px;border-radius:8px;border:1px solid #d9ccb2;background:#fff;padding:0 8px}
</style></head><body><div id="app"></div>
<script>
const U='https://fgpsalshmoqvnqprbqwa.supabase.co',K='sb_publishable__SK88T24ydiEckyZa937ow_woYl0UTj';
let S=JSON.parse(localStorage.pos||'null'),prods=[],all=[],stock=[],cart=[],tab='v',cort=false;
const F={canal:'mostrador',pago:'Efectivo',n:'',w:''};
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $$=n=>'$'+Math.round(n).toLocaleString('es-AR');
const st=p=>/kilo/i.test(p.nombre)?.5:1;
async function auth(body,g){const r=await fetch(U+'/auth/v1/token?grant_type='+g,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Error de acceso');S={t:j.access_token,r:j.refresh_token,e:j.user.email};localStorage.pos=JSON.stringify(S)}
async function api(path,opt={},retry=1){const r=await fetch(U+'/rest/v1/'+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+S.t,'Content-Type':'application/json',...opt.headers}});if(r.status==401&&retry){await auth({refresh_token:S.r},'refresh_token');return api(path,opt,0)}const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(j?.message||'Error');return j}
async function load(){[all,stock]=await Promise.all([api('pos_productos?select=*,pos_producto_componentes(stock_item_id,cantidad)&order=categoria,nombre'),api('pos_stock_items?select=*&activo=eq.true&order=nombre')]);prods=all.filter(p=>p.activo)}
function login(){app.innerHTML=`<header><b>POS Anabela</b></header><main><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Contraseña"><button class="go" onclick="doLogin()">Entrar</button><p id="er" style="color:#b00"></p></main>`}
async function doLogin(){try{await auth({email:$('em').value.trim(),password:$('pw').value},'password');await start()}catch(e){$('er').textContent=e.message}}
async function start(){try{await load();draw()}catch(e){out()}}
function out(){localStorage.removeItem('pos');S=null;login()}
function draw(){app.innerHTML=`<header><b>POS Anabela</b><small>${esc(S.e)} · <a href="#" onclick="out()" style="color:#fff">salir</a></small></header><nav><button class="${tab=='v'?'on':''}" onclick="tab='v';draw()">Vender</button><button class="${tab=='s'?'on':''}" onclick="tab='s';draw()">Stock</button><button class="${tab=='p'?'on':''}" onclick="tab='p';draw()">Productos</button><button class="${tab=='c'?'on':''}" onclick="tab='c';cargarCaja()">Caja</button></nav><main>${tab=='v'?vender():tab=='s'?stockV():tab=='c'?cajaV():prodV()}</main>${tab=='v'&&cart.length?bar():''}`}
function vender(){let h='',c=null;for(const p of prods){if(p.categoria!==c){if(c!==null)h+='</div>';c=p.categoria;h+=`<div class="cat">${esc(c)}</div><div class="g">`}h+=`<button class="p" onclick="add('${p.id}')">${esc(p.nombre)}<small>${p.precio==null?'sin precio':$$(p.precio)}</small></button>`}return h+'</div>'}
function add(id){const p=prods.find(x=>x.id==id),l=cart.find(x=>x.id==id);if(l){l.q+=st(p);return draw()}let pr=p.precio;if(pr==null){pr=parseFloat((prompt('Precio de "'+p.nombre+'"')||'').replace(',','.'));if(isNaN(pr))return}cart.push({id,q:st(p),pr});draw()}
function qty(id,d){const l=cart.find(x=>x.id==id),p=prods.find(x=>x.id==id);l.q+=d*st(p);if(l.q<=0)cart=cart.filter(x=>x!=l);draw()}
const opts=(a,v)=>a.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('');
function bar(){const t=cart.reduce((a,l)=>a+l.q*l.pr,0);return `<div class="bar">${cart.map(l=>{const p=prods.find(x=>x.id==l.id);return `<div class="row"><span>${esc(p.nombre)}</span><span class="q"><button onclick="qty('${l.id}',-1)">−</button> ${l.q} <button onclick="qty('${l.id}',1)">+</button></span></div>`}).join('')}
<select onchange="F.canal=this.value">${opts(['mostrador','whatsapp','app'],F.canal)}</select>
<select onchange="F.pago=this.value">${opts(['Efectivo','Transferencia','Mercado Pago'],F.pago)}</select>
<label><input type="checkbox" style="width:auto" ${cort?'checked':''} onchange="cort=this.checked;draw()"> Cortesía (cliente nuevo)</label>
<input placeholder="Nombre" value="${esc(F.n)}" oninput="F.n=this.value"><input placeholder="WhatsApp" inputmode="tel" value="${esc(F.w)}" oninput="F.w=this.value">
<button class="go" onclick="cobrar()">${cort?'Registrar cortesía':'Cobrar '+$$(t)}</button><p id="er" style="color:#b00;margin:6px 0 0"></p></div>`}
async function cobrar(){if(cort&&(!F.n.trim()||!F.w.trim()))return $('er').textContent='Para la cortesía cargá nombre y WhatsApp';
const lineas=cart.map(l=>{const p=prods.find(x=>x.id==l.id);return{producto_id:p.id,descripcion:p.nombre,cantidad:l.q,precio_unit:l.pr,consumos:p.pos_producto_componentes.map(c=>({stock_item_id:c.stock_item_id,cantidad:c.cantidad*l.q}))}});
try{await api('rpc/pos_registrar_venta',{method:'POST',body:JSON.stringify({p:{canal:F.canal,tipo:cort?'cortesia':'venta',medio_pago:cort?null:F.pago,cliente_nombre:F.n.trim()||null,cliente_whatsapp:F.w.trim()||null,lineas}})});cart=[];cort=false;F.n=F.w='';await load();draw()}catch(e){$('er').textContent=e.message}}
function stockV(){return stock.map(s=>`<div class="row"><span>${esc(s.nombre)}<br><b>${s.unidad=='g'?(s.stock/1000).toLocaleString('es-AR')+' kg':Number(s.stock)+' u'}</b></span><button class="pb" onclick="prod('${s.id}')">+ Producción</button></div>`).join('')}
async function prod(id){const s=stock.find(x=>x.id==id);const v=parseFloat((prompt('¿Cuánto cocinaste de "'+s.nombre+'"? ('+(s.unidad=='g'?'kilos':'unidades')+')')||'').replace(',','.'));if(isNaN(v)||v<=0)return;try{await api('rpc/pos_cargar_produccion',{method:'POST',body:JSON.stringify({p_item:id,p_cantidad:s.unidad=='g'?v*1000:v})});await load();draw()}catch(e){alert(e.message)}}

async function save(f){try{await f();await load();draw()}catch(e){alert(e.message)}}
const num=t=>parseFloat(String(t).replace(',','.'));
function prodV(){return `<button class="go" onclick="nuevo()">+ Nuevo producto</button>`+all.map(p=>`<div class="row" style="${p.activo?'':'opacity:.45'}"><span>${esc(p.nombre)}<br><small>${esc(p.categoria)} · ${p.precio==null?'sin precio':$$(p.precio)}${p.activo?'':' · oculto'}</small></span><button class="pb" onclick="editar('${p.id}')">Editar</button></div>`).join('')}
async function editar(id){const p=all.find(x=>x.id==id);const n=prompt('Nombre',p.nombre);if(n===null)return;const pr=prompt('Precio (vacío = sin precio)',p.precio??'');if(pr===null)return;if(pr.trim()!==''&&isNaN(num(pr)))return alert('Precio inválido');
const a=confirm(p.activo?'¿Dejarlo visible? (Cancelar = ocultarlo)':'¿Volver a mostrarlo? (Cancelar = sigue oculto)');
save(()=>api('pos_productos?id=eq.'+id,{method:'PATCH',body:JSON.stringify({nombre:n.trim()||p.nombre,precio:pr.trim()===''?null:num(pr),activo:a})}))}
async function nuevo(){const cats=[...new Set(all.map(p=>p.categoria))];const cat=cats[parseInt(prompt('Categoría (escribí el número):\n'+cats.map((c,i)=>(i+1)+'. '+c).join('\n')))-1];if(!cat)return;
const n=(prompt('Nombre del producto')||'').trim();if(!n)return;const pr=(prompt('Precio (vacío = completar después)')||'').trim();if(pr&&isNaN(num(pr)))return alert('Precio inválido');
const k=parseInt(prompt('¿De qué stock descuenta? (escribí el número)\n0. Sin control de stock\n'+stock.map((s,i)=>(i+1)+'. '+s.nombre).join('\n')+'\n'+(stock.length+1)+'. Un stock NUEVO (sabor nuevo)'));if(isNaN(k)||k<0||k>stock.length+1)return;
let sid=k>=1&&k<=stock.length?stock[k-1].id:null,sn=null,u='u',cant=1;
if(k==stock.length+1){sn=(prompt('Nombre del stock nuevo (ej: Ravioles de calabaza)',n)||'').trim();if(!sn)return;u=confirm('¿Se cuenta en unidades? (Aceptar = unidades, Cancelar = gramos)')?'u':'g'}
if(sid||sn){cant=num(prompt('¿Cuánto descuenta cada vez que se vende?\\nEj: 18 una plancha, 12 una docena, 1 una unidad, 1000 un kilo (en gramos)','1'));if(isNaN(cant)||cant<=0)return}
save(async()=>{if(sn){const r=await api('pos_stock_items',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({nombre:sn,unidad:u})});sid=r[0].id}
const r=await api('pos_productos',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({nombre:n,categoria:cat,precio:pr===''?null:num(pr)})});
if(sid)await api('pos_producto_componentes',{method:'POST',body:JSON.stringify({producto_id:r[0].id,stock_item_id:sid,cantidad:cant})})})}
let cajaP='hoy',caja=null,cajaErr='';
function rango(p){const d=new Date();d.setHours(0,0,0,0);let a=new Date(d),b=new Date(d);b.setDate(b.getDate()+1);
if(p=='ayer'){a.setDate(a.getDate()-1);b=new Date(d)}if(p=='semana')a.setDate(a.getDate()-(d.getDay()+6)%7);if(p=='mes')a.setDate(1);if(p=='año')a.setMonth(0,1);return[a.toISOString(),b.toISOString()]}
const ym=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')};
const nomMes=k=>{const[y,m]=k.split('-');const n=new Date(y,m-1,1).toLocaleDateString('es-AR',{month:'long'});return n[0].toUpperCase()+n.slice(1)+' '+y};
const pl=s=>String(s||'').toLowerCase().replace(/\s/g,'');
const PAGO={efectivo:'Efectivo',transferencia:'Transferencia',mercadopago:'Mercado Pago'};
function agregar(v,ped,map){const r={tot:0,pos:0,app:0,nPos:0,nApp:0,mes:{},cat:{},catApp:{},canal:{},pago:{},cort:{n:0,u:0,val:0}};
const su=(o,k,x)=>{o[k]=(o[k]||0)+x};
for(const x of v){const ls=x.pos_venta_lineas||[];
if(x.tipo=='cortesia'){r.cort.n++;for(const l of ls){r.cort.u+=Number(l.cantidad);r.cort.val+=l.cantidad*((l.pos_productos&&l.pos_productos.precio)||0)}continue}
const t=Number(x.total);r.pos+=t;r.nPos++;su(r.mes,ym(x.creada_en),t);su(r.canal,x.canal,t);su(r.pago,PAGO[pl(x.medio_pago)]||x.medio_pago||'Sin dato',t);
for(const l of ls)su(r.cat,(l.pos_productos&&l.pos_productos.categoria)||'Sin categoría',l.cantidad*l.precio_unit)}
for(const p of ped){const t=Number(p.total);r.app+=t;r.nApp++;su(r.mes,ym(p.creado_en),t);su(r.canal,'app',t);su(r.pago,PAGO[pl(p.forma_pago)]||p.forma_pago||'Sin dato',t);
for(const i of (p.pedido_items||[]))su(r.catApp,map[i.nombre_producto]||'Sin categoría',Number(i.subtotal))}
r.tot=r.pos+r.app;return r}
async function cargarCaja(){caja=null;cajaErr='';draw();const[a,b]=rango(cajaP).map(encodeURIComponent);
try{const v=await api(`pos_ventas?select=tipo,canal,medio_pago,total,creada_en,pos_venta_lineas(cantidad,precio_unit,pos_productos(categoria,precio))&creada_en=gte.${a}&creada_en=lt.${b}`);
let ped=[],map={};
try{ped=await api(`pedidos?select=total,forma_pago,creado_en,pedido_items(nombre_producto,subtotal)&estado=eq.entregado&creado_en=gte.${a}&creado_en=lt.${b}`);
const pr=await api('productos?select=nombre,categorias(nombre)');pr.forEach(p=>{if(!map[p.nombre])map[p.nombre]=p.categorias&&p.categorias.nombre})}catch(e){cajaErr='No pude leer los pedidos de la app: '+e.message}
caja=agregar(v,ped,map);if(v.length>=1000||ped.length>=1000)cajaErr='Atención: hay más de 1000 registros en el período y el total puede estar incompleto.'}catch(e){cajaErr=e.message}draw()}
const lista=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,x])=>`<div class="row"><span>${esc(k)}</span><b>${$$(x)}</b></div>`).join('')||'<small>Sin ventas</small>';
function cajaV(){const ch=['hoy','ayer','semana','mes','año'].map(p=>`<button class="pb" style="${p==cajaP?'background:#c4452d;color:#fff':''}" onclick="cajaP='${p}';cargarCaja()">${p[0].toUpperCase()+p.slice(1)}</button>`).join(' ');
const er=cajaErr?`<p style="color:#b00">${esc(cajaErr)}</p>`:'';if(!caja)return ch+er+(cajaErr?'':'<p>Cargando…</p>');const c=caja;
return ch+er+`<h2 style="margin:14px 0 0">${$$(c.tot)}</h2><small>Total vendido · ${c.nPos} ventas de mostrador/WhatsApp y ${c.nApp} pedidos entregados de la app</small>${cajaP=='año'?`<div class="cat">Mes a mes</div>${Object.keys(c.mes).sort().map(k=>`<div class="row"><span>${nomMes(k)}</span><b>${$$(c.mes[k])}</b></div>`).join('')||'<small>Sin ventas</small>'}`:''}<div class="cat">Mostrador y WhatsApp · ${$$(c.pos)}</div>${lista(c.cat)}<div class="cat">App · ${$$(c.app)}</div>${lista(c.catApp)}<div class="cat">Por canal</div>${lista(c.canal)}<div class="cat">Por forma de pago</div>${lista(c.pago)}<div class="cat">Cortesías (no suman al total)</div><div class="row"><span>${c.cort.n} cortesías · ${c.cort.u} unidades</span><b>${$$(c.cort.val)}</b></div><small>Valor a precio de lista</small>`}
function refrescar(){if(!S||document.hidden)return;load().then(()=>{const f=document.activeElement;if(!cart.length&&!(f&&/INPUT|SELECT|TEXTAREA/.test(f.tagName)))draw()}).catch(()=>{})}
setInterval(refrescar,20000);document.addEventListener('visibilitychange',refrescar);
S?start():login();
</script></body></html>
