<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Anabela</title><link rel="manifest" href="manifest-pos.json"><meta name="theme-color" content="#c4452d">
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#faf5e9;color:#2a2118}
header{background:#c4452d;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
nav{display:flex}nav button{flex:1;padding:12px;border:0;background:#efe4cf;font-size:15px}nav .on{background:#faf5e9;font-weight:700}
main{padding:12px;padding-bottom:90px}button{font:inherit}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.p{padding:14px 8px;border:1px solid #d9ccb2;background:#fff;border-radius:10px;text-align:left}.p small{display:block;color:#7a6a55}
.cat{margin:14px 0 6px;font-weight:700;color:#c4452d}
input,select{width:100%;padding:10px;margin:4px 0;border:1px solid #d9ccb2;border-radius:8px;font:inherit}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #c4452d;padding:10px 12px;max-height:62vh;overflow:auto}
.go{width:100%;padding:14px;border:0;border-radius:10px;background:#c4452d;color:#fff;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dotted #d9ccb2}
.q button,.pb{min-width:34px;height:34px;border-radius:8px;border:1px solid #d9ccb2;background:#fff;padding:0 8px}
</style></head><body><div id="app"></div>
<script>
const U='https://fgpsalshmoqvnqprbqwa.supabase.co',K='sb_publishable__SK88T24ydiEckyZa937ow_woYl0UTj';
let S=JSON.parse(localStorage.pos||'null'),prods=[],stock=[],cart=[],tab='v',cort=false;
const F={canal:'mostrador',pago:'Efectivo',n:'',w:''};
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $$=n=>'$'+Math.round(n).toLocaleString('es-AR');
const st=p=>/kilo/i.test(p.nombre)?.5:1;
async function auth(body,g){const r=await fetch(U+'/auth/v1/token?grant_type='+g,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Error de acceso');S={t:j.access_token,r:j.refresh_token,e:j.user.email};localStorage.pos=JSON.stringify(S)}
async function api(path,opt={},retry=1){const r=await fetch(U+'/rest/v1/'+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+S.t,'Content-Type':'application/json',...opt.headers}});if(r.status==401&&retry){await auth({refresh_token:S.r},'refresh_token');return api(path,opt,0)}const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(j?.message||'Error');return j}
async function load(){[prods,stock]=await Promise.all([api('pos_productos?select=*,pos_producto_componentes(stock_item_id,cantidad)&activo=eq.true&order=categoria,nombre'),api('pos_stock_items?select=*&activo=eq.true&order=nombre')])}
function login(){app.innerHTML=`<header><b>POS Anabela</b></header><main><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Contraseña"><button class="go" onclick="doLogin()">Entrar</button><p id="er" style="color:#b00"></p></main>`}
async function doLogin(){try{await auth({email:$('em').value.trim(),password:$('pw').value},'password');await start()}catch(e){$('er').textContent=e.message}}
async function start(){try{await load();draw()}catch(e){out()}}
function out(){localStorage.removeItem('pos');S=null;login()}
function draw(){app.innerHTML=`<header><b>POS Anabela</b><small>${esc(S.e)} · <a href="#" onclick="out()" style="color:#fff">salir</a></small></header><nav><button class="${tab=='v'?'on':''}" onclick="tab='v';draw()">Vender</button><button class="${tab=='s'?'on':''}" onclick="tab='s';draw()">Stock</button></nav><main>${tab=='v'?vender():stockV()}</main>${tab=='v'&&cart.length?bar():''}`}
function vender(){let h='',c=null;for(const p of prods){if(p.categoria!==c){if(c!==null)h+='</div>';c=p.categoria;h+=`<div class="cat">${esc(c)}</div><div class="g">`}h+=`<button class="p" onclick="add('${p.id}')">${esc(p.nombre)}<small>${p.precio==null?'sin precio':$$(p.precio)}</small></button>`}return h+'</div>'}
function add(id){const p=prods.find(x=>x.id==id),l=cart.find(x=>x.id==id);if(l){l.q+=st(p);return draw()}let pr=p.precio;if(pr==null){pr=parseFloat((prompt('Precio de "'+p.nombre+'"')||'').replace(',','.'));if(isNaN(pr))return}cart.push({id,q:st(p),pr});draw()}
function qty(id,d){const l=cart.find(x=>x.id==id),p=prods.find(x=>x.id==id);l.q+=d*st(p);if(l.q<=0)cart=cart.filter(x=>x!=l);draw()}
const opts=(a,v)=>a.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('');
function bar(){const t=cart.reduce((a,l)=>a+l.q*l.pr,0);return `<div class="bar">${cart.map(l=>{const p=prods.find(x=>x.id==l.id);return `<div class="row"><span>${esc(p.nombre)}</span><span class="q"><button onclick="qty('${l.id}',-1)">−</button> ${l.q} <button onclick="qty('${l.id}',1)">+</button></span></div>`}).join('')}
<select onchange="F.canal=this.value">${opts(['mostrador','whatsapp','app'],F.canal)}</select>
<select onchange="F.pago=this.value">${opts(['Efectivo','Transferencia','Mercado Pago'],F.pago)}</select>
<label><input type="checkbox" style="width:auto" ${cort?'checked':''} onchange="cort=this.checked;draw()"> Cortesía (cliente nuevo)</label>
<input placeholder="Nombre" value="${esc(F.n)}" oninput="F.n=this.value"><input placeholder="WhatsApp" inputmode="tel" value="${esc(F.w)}" oninput="F.w=this.value">
<button class="go" onclick="cobrar()">${cort?'Registrar cortesía':'Cobrar '+$$(t)}</button><p id="er" style="color:#b00;margin:6px 0 0"></p></div>`}
async function cobrar(){if(cort&&(!F.n.trim()||!F.w.trim()))return $('er').textContent='Para la cortesía cargá nombre y WhatsApp';
const lineas=cart.map(l=>{const p=prods.find(x=>x.id==l.id);return{producto_id:p.id,descripcion:p.nombre,cantidad:l.q,precio_unit:l.pr,consumos:p.pos_producto_componentes.map(c=>({stock_item_id:c.stock_item_id,cantidad:c.cantidad*l.q}))}});
try{await api('rpc/pos_registrar_venta',{method:'POST',body:JSON.stringify({p:{canal:F.canal,tipo:cort?'cortesia':'venta',medio_pago:cort?null:F.pago,cliente_nombre:F.n.trim()||null,cliente_whatsapp:F.w.trim()||null,lineas}})});cart=[];cort=false;F.n=F.w='';await load();draw()}catch(e){$('er').textContent=e.message}}
function stockV(){return stock.map(s=>`<div class="row"><span>${esc(s.nombre)}<br><b>${s.unidad=='g'?(s.stock/1000).toLocaleString('es-AR')+' kg':Number(s.stock)+' u'}</b></span><button class="pb" onclick="prod('${s.id}')">+ Producción</button></div>`).join('')}
async function prod(id){const s=stock.find(x=>x.id==id);const v=parseFloat((prompt('¿Cuánto cocinaste de "'+s.nombre+'"? ('+(s.unidad=='g'?'kilos':'unidades')+')')||'').replace(',','.'));if(isNaN(v)||v<=0)return;try{await api('rpc/pos_cargar_produccion',{method:'POST',body:JSON.stringify({p_item:id,p_cantidad:s.unidad=='g'?v*1000:v})});await load();draw()}catch(e){alert(e.message)}}
S?start():login();
</script></body></html>
